<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orb Debugger</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .CodeMirror {
            height: 70vh;
            font-size: 14px;
        }
        .breakpoint {
            color: #ff5c5c;
            cursor: pointer;
        }
        .current-line {
            background-color: rgba(255, 255, 0, 0.2);
        }
        .variable-value {
            font-family: monospace;
            white-space: pre;
        }
        .watch-expression {
            background: #2d3748;
            padding: 0.5rem;
            margin: 0.25rem 0;
            border-radius: 0.25rem;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <div class="w-1/4 bg-gray-800 flex flex-col h-full">
            <!-- Debug Controls -->
            <div class="p-4 bg-gray-900 border-b border-gray-700">
                <div class="flex space-x-2 mb-4">
                    <button onclick="continueExecution()" class="px-3 py-1 bg-green-600 rounded hover:bg-green-700">
                        Continue (F5)
                    </button>
                    <button onclick="pauseExecution()" class="px-3 py-1 bg-yellow-600 rounded hover:bg-yellow-700">
                        Pause
                    </button>
                </div>
                <div class="flex space-x-2">
                    <button onclick="stepOver()" class="px-3 py-1 bg-blue-600 rounded hover:bg-blue-700">
                        Step Over (F10)
                    </button>
                    <button onclick="stepInto()" class="px-3 py-1 bg-blue-600 rounded hover:bg-blue-700">
                        Step Into (F11)
                    </button>
                    <button onclick="stepOut()" class="px-3 py-1 bg-blue-600 rounded hover:bg-blue-700">
                        Step Out (Shift+F11)
                    </button>
                </div>
            </div>

            <!-- Variables Panel -->
            <div class="flex-1 overflow-auto p-4">
                <h3 class="font-bold mb-2">Variables</h3>
                <div id="variables" class="space-y-2"></div>
            </div>

            <!-- Watch Panel -->
            <div class="p-4 border-t border-gray-700">
                <div class="flex mb-2">
                    <input type="text" id="watch-input" 
                           class="flex-1 bg-gray-700 text-white px-2 py-1 rounded-l"
                           placeholder="Add watch expression">
                    <button onclick="addWatch()" 
                            class="bg-blue-600 hover:bg-blue-700 px-3 rounded-r">
                        Add
                    </button>
                </div>
                <div id="watches" class="space-y-2"></div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col h-full overflow-hidden">
            <!-- Toolbar -->
            <div class="bg-gray-800 p-2 flex justify-between items-center">
                <div class="flex space-x-2">
                    <button onclick="loadFile()" class="px-3 py-1 bg-gray-700 rounded hover:bg-gray-600">
                        Open File
                    </button>
                    <button onclick="saveFile()" class="px-3 py-1 bg-gray-700 rounded hover:bg-gray-600">
                        Save
                    </button>
                </div>
                <div id="status" class="text-sm text-gray-400">Ready</div>
            </div>

            <!-- Editor -->
            <div class="flex-1 overflow-hidden">
                <textarea id="editor"></textarea>
            </div>

            <!-- Console -->
            <div class="h-1/4 bg-black bg-opacity-50 overflow-auto p-2 font-mono text-sm">
                <div class="font-bold mb-1">Console</div>
                <div id="console" class="space-y-1"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
    <script>
        // Initialize CodeMirror
        const editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
            lineNumbers: true,
            mode: 'python',
            theme: 'dracula',
            lineWrapping: true,
            gutters: ["CodeMirror-linenumbers", "breakpoints"],
            extraKeys: {
                'F5': continueExecution,
                'F10': stepOver,
                'F11': stepInto,
                'Shift-F11': stepOut
            }
        });

        // WebSocket connection
        let ws;
        let currentLine = null;
        let breakpoints = new Set();
        let watches = [];

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/debug/ws/${Date.now()}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                logToConsole('Debugger connected');
                updateStatus('Connected');
            };

            ws.onclose = () => {
                logToConsole('Debugger disconnected');
                updateStatus('Disconnected');
                // Try to reconnect after 2 seconds
                setTimeout(connectWebSocket, 2000);
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                console.log('Message from server:', message);
                
                switch (message.type) {
                    case 'breakpoint_hit':
                        highlightLine(message.data.line - 1);
                        updateVariables(message.data.variables);
                        updateWatches();
                        updateStatus(`Paused at line ${message.data.line}`);
                        break;
                    case 'function_entry':
                        logToConsole(`→ ${message.data.name}(${formatArgs(message.data.args)})`);
                        break;
                    case 'function_exit':
                        logToConsole(`← ${message.data.name} returned`);
                        break;
                    case 'error':
                        logToConsole(`ERROR: ${message.data.error}`, 'text-red-400');
                        logToConsole(message.data.traceback, 'text-red-400 text-xs');
                        break;
                    case 'evaluation_result':
                        logToConsole(`> ${message.data.expression} = ${message.data.result} (${message.data.type})`);
                        break;
                    case 'evaluation_error':
                        logToConsole(`Error: ${message.data.error}`, 'text-yellow-400');
                        break;
                }
            };
        }

        // Debugger control functions
        function sendCommand(command, data = {}) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: command, data }));
            } else {
                logToConsole('Not connected to debugger', 'text-yellow-400');
            }
        }

        function continueExecution() {
            updateStatus('Running...');
            sendCommand('continue_execution');
        }

        function pauseExecution() {
            sendCommand('pause');
        }

        function stepOver() {
            updateStatus('Stepping over...');
            sendCommand('step_over');
        }

        function stepInto() {
            updateStatus('Stepping into...');
            sendCommand('step_into');
        }

        function stepOut() {
            updateStatus('Stepping out...');
            sendCommand('step_out');
        }

        // Breakpoint management
        editor.on("gutterClick", (cm, line) => {
            const info = cm.lineInfo(line);
            
            if (info.gutterMarkers) {
                // Remove breakpoint
                cm.setGutterMarker(line, "breakpoints", null);
                sendCommand('remove_breakpoint', {
                    filePath: 'current_file.py',
                    lineNumber: line + 1
                });
            } else {
                // Add breakpoint
                const marker = document.createElement("div");
                marker.innerHTML = "●";
                marker.className = "breakpoint";
                cm.setGutterMarker(line, "breakpoints", marker);
                sendCommand('add_breakpoint', {
                    filePath: 'current_file.py',
                    lineNumber: line + 1
                });
            }
        });

        // Watch expressions
        function addWatch() {
            const input = document.getElementById('watch-input');
            const expr = input.value.trim();
            
            if (expr && !watches.includes(expr)) {
                watches.push(expr);
                renderWatches();
                input.value = '';
                updateWatches();
            }
        }

        function removeWatch(expr) {
            const index = watches.indexOf(expr);
            if (index > -1) {
                watches.splice(index, 1);
                renderWatches();
            }
        }

        function renderWatches() {
            const container = document.getElementById('watches');
            container.innerHTML = '';
            
            watches.forEach(expr => {
                const div = document.createElement('div');
                div.className = 'watch-expression flex justify-between items-center';
                div.innerHTML = `
                    <span>${escapeHtml(expr)}</span>
                    <div>
                        <span id="watch-${expr.replace(/\W/g, '_')}" class="text-gray-400">?</span>
                        <button onclick="removeWatch('${escapeHtml(expr)}')" class="text-red-400 hover:text-red-300 ml-2">×</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function updateWatches() {
            watches.forEach(expr => {
                sendCommand('evaluate', { expression: expr });
            });
        }

        // Helper functions
        function highlightLine(line) {
            if (currentLine !== null) {
                editor.removeLineClass(currentLine, 'background', 'current-line');
            }
            
            currentLine = line;
            editor.addLineClass(line, 'background', 'current-line');
            editor.scrollIntoView({ line, ch: 0 }, 100);
        }

        function updateVariables(vars) {
            const container = document.getElementById('variables');
            container.innerHTML = '';
            
            for (const [name, value] of Object.entries(vars)) {
                const div = document.createElement('div');
                div.className = 'text-sm';
                div.innerHTML = `
                    <span class="text-blue-400">${escapeHtml(name)}</span>: 
                    <span class="variable-value">${formatValue(value)}</span>
                `;
                container.appendChild(div);
            }
        }

        function logToConsole(message, className = '') {
            const console = document.getElementById('console');
            const entry = document.createElement('div');
            entry.className = className;
            entry.textContent = message;
            console.appendChild(entry);
            console.scrollTop = console.scrollHeight;
        }

        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }

        function formatValue(value) {
            if (value === undefined) return 'undefined';
            if (value === null) return 'null';
            if (Array.isArray(value)) return `[${value.map(formatValue).join(', ')}]`;
            if (typeof value === 'object') {
                try {
                    return JSON.stringify(value, null, 2);
                } catch (e) {
                    return String(value);
                }
            }
            return String(value);
        }

        function formatArgs(args) {
            if (!args) return '';
            return Object.entries(args)
                .map(([k, v]) => `${k}=${formatValue(v)}`)
                .join(', ');
        }

        function escapeHtml(unsafe) {
            return unsafe
                .toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // File operations
        function loadFile() {
            // In a real app, you would implement file loading here
            logToConsole('File loading not implemented in this demo');
        }

        function saveFile() {
            // In a real app, you would implement file saving here
            logToConsole('File saving not implemented in this demo');
        }

        // Initialize
        connectWebSocket();
        
        // Load sample code
        const sampleCode = `def fibonacci(n):
    if n <= 1:
        return n
    return fibonacci(n-1) + fibonacci(n-2)

# Set a breakpoint by clicking in the gutter
result = fibonacci(5)
print(f"Fibonacci of 5 is: {result}")

# Try stepping through this function
def greet(name):
    greeting = f"Hello, {name}!"
    return greeting

message = greet("World")
print(message)
`;
        
        editor.setValue(sampleCode);
    </script>
</body>
</html>
